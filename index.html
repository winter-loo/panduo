<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>walk the moon</title>

  <!-- PRELOAD MUSIC FONT -->
  <!-- <link rel="preload" href="https://cdn.jsdelivr.net/npm/@vexflow-fonts/bravura/bravura.woff2" as="font" -->
  <!--   type="font/woff2" crossorigin="anonymous"> -->
  <!-- vite automatically loads this font file from the 'public' folder -->
  <link rel="preload" href="/bravura.woff2" as="font" type="font/woff2" crossorigin="anonymous">
  <style>
    @font-face {
      font-family: "Bravura";
      /* src: url("https://cdn.jsdelivr.net/npm/@vexflow-fonts/bravura/bravura.woff2") format("woff2"); */
      src: url("/bravura.woff2") format("woff2");
      font-display: block;
    }
  </style>
  <!-- END FONT CONFIGURATION -->

  <style>
    body {
      margin: 0;
      padding: 20px;
      font-family: Arial, sans-serif;
    }

    #container {
      position: relative;
    }

    #moving-staff {
      display: flex;
      align-items: flex-start;
      flex-direction: row;
      position: relative;
      z-index: 2;
    }

    #notes-container-wrapper {
      width: 100%;
      overflow: hidden;
      cursor: grab;
      user-select: none;
      /* the distance being visible from the left of the still cursor line */
      margin-left: -40px;
    }

    #notes-container-wrapper:active {
      cursor: grabbing;
    }

    #notes-container {
      /* the distance we need offset to keep whole notes area visible */
      /* the above 40px - 5px(the width of the still cursor line) */
      padding-left: 35px;
    }

    #grid {
      position: absolute;
      top: 0;
      left: 0;
      pointer-events: none;
      z-index: 1;
      opacity: 0.3;
    }

    .controls {
      margin-bottom: 10px;
    }

    button {
      margin-right: 10px;
      padding: 5px 10px;
    }
  </style>

  <!-- stave style -->
  <style>
    .vf-pitch-C {
      color: crimson;
    }

    .vf-pitch-D {
      color: darkmagenta;
    }

    .vf-pitch-E {
      color: sienna;
    }

    .vf-pitch-F {
      color: fuchsia;
    }

    .vf-pitch-G {
      color: gold;
    }

    .vf-pitch-A {
      color: aqua;
    }

    .vf-pitch-B {
      color: blueviolet;
    }
  </style>
</head>

<body>
  <div class="controls">
    <button onclick="toggleGrid()">Toggle Grid</button>
    <button onclick="changeGridSize(5)">5px Grid</button>
    <button onclick="changeGridSize(10)">10px Grid</button>
    <button onclick="changeGridSize(20)">20px Grid</button>
    <span id="info">Grid: 10px</span>
  </div>

  <div id="container">
    <svg id="grid" width="100%" height="300"></svg>
    <div id="moving-staff">
      <div id="fixed-clef"></div>
      <div id="notes-container-wrapper">
        <div id="notes-container"></div>
      </div>
    </div>
  </div>

  <button type="button" id="renderButton">rerender</button>
  <button type="button" id="pauseButton">pause</button>
  <button type="button" id="resumeButton">resume</button>
  <button type="button" id="resetButton">reset</button>

  <script type="module" lang="ts">
    import {VexFlow} from "./entry/vexflow-core.ts";

    console.log(VexFlow.BUILD);

    // This is the correct font setup! Be sure to preload Bravura font. See file header above.
    //
    // If use "./entry/vexflow.ts", the font will load asynchrnously which results Element.measureText()
    // getting wrong text metrics. Even with `await document.fonts.ready`, it yet does not work.
    const musicFontName = 'Bravura';
    VexFlow.setFonts(`${musicFontName}`);

    // Grid functionality
    let gridSize = 10;
    let gridVisible = true;

    // Horizontal drag functionality
    let isDragging = false;
    let dragStartX = 0;
    let containerStartX = 0;

    function drawGrid(size) {
      const grid = document.getElementById('grid');
      const container = document.getElementById('container');
      const width = container.offsetWidth || window.innerWidth - 40;
      const height = 300;

      grid.innerHTML = '';
      grid.setAttribute('width', width);
      grid.setAttribute('height', height);

      // Vertical lines
      for (let x = 0; x <= width; x += size) {
        const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
        line.setAttribute('x1', x);
        line.setAttribute('y1', 0);
        line.setAttribute('x2', x);
        line.setAttribute('y2', height);
        line.setAttribute('stroke', x % (size * 5) === 0 ? '#ff0000' : '#cccccc');
        line.setAttribute('stroke-width', x % (size * 5) === 0 ? '1' : '0.5');
        grid.appendChild(line);
      }

      // Horizontal lines
      for (let y = 0; y <= height; y += size) {
        const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
        line.setAttribute('x1', 0);
        line.setAttribute('y1', y);
        line.setAttribute('x2', width);
        line.setAttribute('y2', y);
        line.setAttribute('stroke', y % (size * 5) === 0 ? '#ff0000' : '#cccccc');
        line.setAttribute('stroke-width', y % (size * 5) === 0 ? '1' : '0.5');
        grid.appendChild(line);
      }

      // Add coordinate labels
      for (let x = 0; x <= width; x += size * 5) {
        const text = document.createElementNS('http://www.w3.org/2000/svg', 'text');
        text.setAttribute('x', x + 2);
        text.setAttribute('y', 12);
        text.setAttribute('font-size', '10');
        text.setAttribute('fill', '#666');
        text.textContent = x;
        grid.appendChild(text);
      }

      for (let y = size * 5; y <= height; y += size * 5) {
        const text = document.createElementNS('http://www.w3.org/2000/svg', 'text');
        text.setAttribute('x', 2);
        text.setAttribute('y', y - 2);
        text.setAttribute('font-size', '10');
        text.setAttribute('fill', '#666');
        text.textContent = y;
        grid.appendChild(text);
      }
    }

    function toggleGrid() {
      gridVisible = !gridVisible;
      document.getElementById('grid').style.display = gridVisible ? 'block' : 'none';
    }

    function changeGridSize(size) {
      gridSize = size;
      drawGrid(size);
      document.getElementById('info').textContent = `Grid: ${size}px`;
    }

    VexFlow.NoteHead.DEBUG = true;
    VexFlow.Stem.DEBUG = true;
    VexFlow.StaveNote.DEBUG = true;
    VexFlow.Formatter.DEBUG = true;
    VexFlow.EasyScore.DEBUG = true;
    VexFlow.ModifierContext.DEBUG = true;

    class MovingStaff {
      static MEASURE_WIDTH = 400;
      static STAVE_HEIGHT = 120;

      constructor() {
        // Create an SVG renderer and attach it to the DIV element with id="output".
        // const div = document.getElementById("moving-staff");
        this.numPaddingSpaces = (MovingStaff.STAVE_HEIGHT - 40) / 2 / 10;

        // draw the treble clef on the staff independently
        const TREBLE_CLEF_STAVE_WIDTH = 90;
        const clef = document.getElementById("fixed-clef");
        clef.innerHTML = '';
        const renderer = new VexFlow.Renderer(clef, VexFlow.Renderer.Backends.SVG);
        renderer.resize(TREBLE_CLEF_STAVE_WIDTH, MovingStaff.STAVE_HEIGHT);
        this.clefStave = new VexFlow.Stave(0, 0, TREBLE_CLEF_STAVE_WIDTH, {
          spaceAboveStaffLn: this.numPaddingSpaces,
          spaceBelowStaffLn: this.numPaddingSpaces,
          stillCursor: true,
        });
        this.clefStave.addClef("treble");
        this.clefStave.setContext(renderer.getContext()).draw();

        this.notesContainer = document.getElementById("notes-container");
        this.renderer = new VexFlow.Renderer(this.notesContainer, VexFlow.Renderer.Backends.SVG);

        // Configure the rendering context.
        // 45000 / 300 = 150 measures = 600 beats = 600 seconds = 10 minutes
        this.renderer.resize(30000, MovingStaff.STAVE_HEIGHT);
        this.context = this.renderer.getContext();
        // do not count the treble clef width
        this.staveX = 0;
        this.notes = [];

        this.movingOffset = 0;
      }

      addMeasure(notes) {
        // add stave
        // svg rendered five-stave-line height: 40
        // spacing between stave lines: 10
        let num = (MovingStaff.STAVE_HEIGHT - 40) / 2 / 10;
        const measureStave = new VexFlow.Stave(this.staveX, 0, MovingStaff.MEASURE_WIDTH, {
          spaceAboveStaffLn: this.numPaddingSpaces,
          spaceBelowStaffLn: this.numPaddingSpaces,
        });
        this.staveX += MovingStaff.MEASURE_WIDTH;
        // draw five staff lines and treble clef
        measureStave.setContext(this.context).draw();

        let staveNotes = [];
        notes.forEach((note) => {
          let sn = new VexFlow.StaveNote(note);
          staveNotes.push(sn);
          this.notes.push(sn);
          // NOTE: why does VexFlow not draw a dotted quarter note for me?
          if (note.duration.indexOf("d") != -1) {
            const dot = new VexFlow.Dot();
            sn.addModifier(dot, 0);
          }
        });
        if (staveNotes.length > 0) {
          VexFlow.Formatter.FormatAndDraw(this.context, measureStave, staveNotes);
        }
      }

      move(offset) {
        this.notesContainer.style.transform = `translate3d(-${offset}px, 0, 0)`;
      }

      moveDelta(offset) {
        this.movingOffset += offset;
        this.move(this.movingOffset);
      }
    };

    const SONG_DATA = {
      title: "Different Colors",
      artist: "Walk the Moon",
      measures: [
        {
          notes: [
            {keys: ["d/4/S2"], duration: "4", fingering: 2},
            {keys: ["f/4/S2"], duration: "8", fingering: 4},
            {keys: ["c/4/S2"], duration: "8", fingering: 1},
            {keys: ["g/4/S2"], duration: "2", fingering: null}
          ]
        },
        {
          notes: [
            {keys: ["b/4/S2"], duration: "1", fingering: 5},
          ]
        }
      ]
    };

    let animationId = null;
    let xOffset = 0;

    const moving = () => {
      const animate = (timestamp) => {
        xOffset += 1;
        window.movingStaff.move(xOffset);

        if (xOffset > SONG_DATA.measures.length * MovingStaff.MEASURE_WIDTH) {
          cancelAnimationFrame(animationId);
          animationId = null;
          return;
        }

        animationId = requestAnimationFrame(animate);
      };

      animationId = requestAnimationFrame(animate);
    };

    window.movingStaff = null;
    function renderSong() {
      const nc = document.getElementById("notes-container");
      nc.innerHTML = '';

      window.movingStaff = new MovingStaff();
      for (let i = 0; i < SONG_DATA.measures.length; i++) {
        window.movingStaff.addMeasure(SONG_DATA.measures[i].notes);
      }
      // add extra measures at the end so that we do not see empty spaces at the end
      // for (let i = 0; i < 10; i++) {
      //   movingStaff.addMeasure([]);
      // }
    }

    document.addEventListener('DOMContentLoaded', () => {
      console.log(`rendering song...`);
      renderSong();
    });

    document.getElementById('renderButton').addEventListener('click', () => {
      renderSong();
    });
    document.getElementById('pauseButton').addEventListener('click', () => {
      cancelAnimationFrame(animationId);
      animationId = null;
    });
    document.getElementById('resumeButton').addEventListener('click', () => {
      moving();
    });
    document.getElementById('resetButton').addEventListener('click', () => {
      reset();
    });
    document.addEventListener('keydown', (event) => {
      if (event.key == 'r') {
        reset();
      }
    });

    function reset() {
      xOffset = 0;
      cancelAnimationFrame(animationId);
      animationId = null;
      let ncw = document.getElementById('notes-container');
      window.movingStaff.move(0);
    }

    // Initialize grid
    drawGrid(gridSize);

    // Horizontal drag functionality for notes-container-wrapper
    const notesContainerWrapper = document.getElementById('notes-container-wrapper');
    const notesContainer = document.getElementById('notes-container');

    notesContainerWrapper.addEventListener('mousedown', function (e) {
      isDragging = true;
      dragStartX = e.clientX;

      // Get current horizontal transform value
      const transform = notesContainer.style.transform;
      const translateMatch = transform.match(/translate3d\((-?\d+)px/);

      if (translateMatch) {
        containerStartX = parseInt(translateMatch[1]);
      } else {
        containerStartX = 0;
      }

      e.preventDefault();
    });

    document.addEventListener('mousemove', function (e) {
      const container = document.getElementById('container');
      const rect = container.getBoundingClientRect();
      const x = Math.round(e.clientX - rect.left);
      const y = Math.round(e.clientY - rect.top);

      if (isDragging) {
        const deltaX = e.clientX - dragStartX;
        const newX = Math.min(containerStartX + deltaX, 0);

        window.movingStaff.move(-newX);
        document.getElementById('info').textContent = `Grid: ${gridSize}px | Mouse: (${x}, ${y}) | Container X: ${newX}`;
      } else {
        document.getElementById('info').textContent = `Grid: ${gridSize}px | Mouse: (${x}, ${y})`;
      }
    });

    document.addEventListener('mouseup', function () {
      isDragging = false;
    });

    // Redraw grid on window resize
    window.addEventListener('resize', () => {
      drawGrid(gridSize);
    });

    const keysHoldingMap = new Map([
      ['Space', {noteName: 'C', holding: false}],
      ['KeyF', {noteName: 'D', holding: false}],
      ['KeyG', {noteName: 'E', holding: false}],
      ['KeyH', {noteName: 'F', holding: false}],
      ['KeyJ', {noteName: 'G', holding: false}],
      ['KeyK', {noteName: 'A', holding: false}],
      ['KeyL', {noteName: 'B', holding: false}],
    ]);

    let pressTick = null;
    let note_idx = 0;
    document.addEventListener('keydown', function (event) {
      let validKeyDown = keysHoldingMap.get(event.code);
      if (validKeyDown != undefined && !validKeyDown.holding) {
        validKeyDown.holding = true;
      }
    });

    document.addEventListener('keyup', function (event) {
      let state = keysHoldingMap.get(event.code);
      if (state) {
        state.holding = false;
      }
      pressTick = null;
    });

    // one second should move 1000 pixels
    const speed = 100 / 1000;
    function update(timestamp) {
      keysHoldingMap.forEach(({noteName, holding}, key) => {
        if (holding) {
          if (note_idx < movingStaff.notes.length) {
            console.log(`note_idx: ${note_idx}`);
            let staveNote = movingStaff.notes[note_idx];
            if (noteName == staveNote.getKeyProps()[0].key) {
              if (!pressTick) {
                pressTick = timestamp;
                console.log(`key ${key} press tick ${pressTick}`);
              }
              let progress = (timestamp - pressTick) * speed;
              pressTick = timestamp;

              if (!staveNote.expandToDelta(progress, timestamp)) {
                window.movingStaff.moveDelta(progress);
              } else if (note_idx < movingStaff.notes.length) {
                if (note_idx + 1 != movingStaff.notes.length) {
                  // move extra 5px width of the still cursor
                  // but do not do an extra move when we at the last note
                  window.movingStaff.moveDelta(5);
                }
                note_idx += 1;
              }
            }
          }
        }
      });
      requestAnimationFrame(update);
    }

    requestAnimationFrame(update);
  </script>
</body>

</html>
