<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title></title>
  <style>
    .css-animated-svg circle {
      fill: dodgerblue;
    }

    .pulse {
      animation: pulse 2s infinite alternate;
    }

    @keyframes pulse {
      from {
        r: 30;
      }

      to {
        r: 60;
      }
    }
  </style>
</head>

<body>
  <svg width="300" height="120" style="border:1px solid #ccc">
    <circle cx="60" cy="60" r="20" fill="dodgerblue">
      <!-- move horizontally -->
      <animate attributeName="cx" values="60;240;60" dur="4s" repeatCount="indefinite" />

      <!-- fade in and out -->
      <animate attributeName="opacity" values="1;0.2;1" dur="4s" repeatCount="indefinite" />

      <!-- scale -->
      <animateTransform attributeName="transform" attributeType="XML" type="scale" values="1;1.5;1" additive="sum"
        dur="4s" repeatCount="indefinite" />
    </circle>
  </svg>

  <svg width="200" height="200" class="css-animated-svg">
    <circle cx="100" cy="100" r="50" class="pulse" />
  </svg>

  <svg width="200" height="200">
    <circle id="ball" cx="50" cy="100" r="20" fill="purple" />
  </svg>

  <script>
    const ball = document.getElementById("ball");
    let x = 50, dx = 2;

    function animate() {
      x += dx;
      if (x > 180 || x < 20) dx = -dx; // bounce
      ball.setAttribute("cx", x);
      requestAnimationFrame(animate);
    }

    animate();
  </script>

  <button id="expandBtn">Expand Rectangle</button>
  <button id="resetBtn">Reset Rectangle</button>

  <svg width="400" height="200">
    <g id="donut">
      <rect id="outter-rect"
          x="50" y="80" width="316" height="56"
          stroke="dodgerblue" stroke-width="4" fill="none"
          rx="28" ry="28" />
      <rect id="inner-rect"
          x="58" y="88" width="20" height="40"
          opacity="0" fill="dodgerblue" rx="20" ry="20" />
    </g>
  </svg>

  <script>
    const rect = document.getElementById("inner-rect");
    const button = document.getElementById("expandBtn");
    const resetBtn = document.getElementById("resetBtn");

    let expandAnimationId = null;

    button.addEventListener("mousedown", () => {
      let width = parseInt(rect.getAttribute("width"));
      let targetWidth = 300;
      rect.setAttribute("opacity", 1);


      function animate() {
        if (width < targetWidth) {
          width += 5; // speed of expansion
          rect.setAttribute("width", width);
          expandAnimationId = requestAnimationFrame(animate);
        }
      }

      animate();
    });

    button.addEventListener("mouseup", () => {
      cancelAnimationFrame(expandAnimationId);
    });

    resetBtn.addEventListener("click", () => {
      rect.setAttribute("opacity", 0);
      rect.setAttribute("width", 20);
    })
  </script>

</body>

</html>
