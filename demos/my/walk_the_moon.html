<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>walk the moon</title>
  <style>
    body { margin: 0; padding: 20px; font-family: Arial, sans-serif; }
    #container { position: relative; }
    #moving-staff {
      display: flex;
      align-items: flex-start;
      flex-direction: row;
      position: relative;
      z-index: 2;
    }

    #notes-container-wrapper {
      width: 100%;
      overflow: hidden;
    }

    #grid {
      position: absolute;
      top: 0;
      left: 0;
      pointer-events: none;
      z-index: 1;
      opacity: 0.3;
    }
    .controls { margin-bottom: 10px; }
    button { margin-right: 10px; padding: 5px 10px; }
  </style>
</head>

<body>
  <div class="controls">
    <button onclick="toggleGrid()">Toggle Grid</button>
    <button onclick="changeGridSize(5)">5px Grid</button>
    <button onclick="changeGridSize(10)">10px Grid</button>
    <button onclick="changeGridSize(20)">20px Grid</button>
    <span id="info">Grid: 10px</span>
  </div>

  <div id="container">
    <svg id="grid" width="100%" height="300"></svg>
    <div id="moving-staff">
      <div id="fixed-clef"></div>
      <div id="notes-container-wrapper">
        <div id="notes-container"></div>
      </div>
    </div>
  </div>

  <button type="button" id="pauseButton">pause</button>
  <button type="button" id="resumeButton">resume</button>
  <button type="button" id="resetButton">reset</button>

  <script src="../../build/cjs/vexflow-debug.js"></script>
  <script>
    console.log(VexFlow.BUILD);

    // Grid functionality
    let gridSize = 10;
    let gridVisible = true;

    function drawGrid(size) {
      const grid = document.getElementById('grid');
      const container = document.getElementById('container');
      const width = container.offsetWidth || window.innerWidth - 40;
      const height = 300;

      grid.innerHTML = '';
      grid.setAttribute('width', width);
      grid.setAttribute('height', height);

      // Vertical lines
      for (let x = 0; x <= width; x += size) {
        const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
        line.setAttribute('x1', x);
        line.setAttribute('y1', 0);
        line.setAttribute('x2', x);
        line.setAttribute('y2', height);
        line.setAttribute('stroke', x % (size * 5) === 0 ? '#ff0000' : '#cccccc');
        line.setAttribute('stroke-width', x % (size * 5) === 0 ? '1' : '0.5');
        grid.appendChild(line);
      }

      // Horizontal lines
      for (let y = 0; y <= height; y += size) {
        const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
        line.setAttribute('x1', 0);
        line.setAttribute('y1', y);
        line.setAttribute('x2', width);
        line.setAttribute('y2', y);
        line.setAttribute('stroke', y % (size * 5) === 0 ? '#ff0000' : '#cccccc');
        line.setAttribute('stroke-width', y % (size * 5) === 0 ? '1' : '0.5');
        grid.appendChild(line);
      }

      // Add coordinate labels
      for (let x = 0; x <= width; x += size * 5) {
        const text = document.createElementNS('http://www.w3.org/2000/svg', 'text');
        text.setAttribute('x', x + 2);
        text.setAttribute('y', 12);
        text.setAttribute('font-size', '10');
        text.setAttribute('fill', '#666');
        text.textContent = x;
        grid.appendChild(text);
      }

      for (let y = size * 5; y <= height; y += size * 5) {
        const text = document.createElementNS('http://www.w3.org/2000/svg', 'text');
        text.setAttribute('x', 2);
        text.setAttribute('y', y - 2);
        text.setAttribute('font-size', '10');
        text.setAttribute('fill', '#666');
        text.textContent = y;
        grid.appendChild(text);
      }
    }

    function toggleGrid() {
      gridVisible = !gridVisible;
      document.getElementById('grid').style.display = gridVisible ? 'block' : 'none';
    }

    function changeGridSize(size) {
      gridSize = size;
      drawGrid(size);
      document.getElementById('info').textContent = `Grid: ${size}px`;
    }

    class MovingStaff {
      static MEASURE_WIDTH = 300;
      static STAVE_HEIGHT = 130;

      constructor() {
        // Create an SVG renderer and attach it to the DIV element with id="output".
        // const div = document.getElementById("moving-staff");

        // draw the treble clef on the staff independently
        const TREBLE_CLEF_STAVE_WIDTH = 90;
        const clef = document.getElementById("fixed-clef");
        const renderer = new VexFlow.Renderer(clef, VexFlow.Renderer.Backends.SVG);
        renderer.resize(TREBLE_CLEF_STAVE_WIDTH, MovingStaff.STAVE_HEIGHT);
        this.clefStave = new VexFlow.Stave(10, 0, TREBLE_CLEF_STAVE_WIDTH);
        this.clefStave.addClef("treble");
        this.clefStave.setContext(renderer.getContext()).draw();

        const nc = document.getElementById("notes-container");
        this.renderer = new VexFlow.Renderer(nc, VexFlow.Renderer.Backends.SVG);

        // Current viewport width (including scrollbar)
        const viewportWidth = window.innerWidth;
        // Viewport width excluding scrollbar (more accurate for CSS matching)
        const viewportWidthWithoutScrollbar = document.documentElement.clientWidth;
        const padding = 20;
        const staveAreaWidth = viewportWidthWithoutScrollbar - padding - TREBLE_CLEF_STAVE_WIDTH;

        // Configure the rendering context.
        // this.renderer.resize(staveAreaWidth, MovingStaff.STAVE_HEIGHT);
        // 45000 / 300 = 150 measures = 600 beats = 600 seconds = 10 minutes
        this.renderer.resize(30000, MovingStaff.STAVE_HEIGHT);
        this.context = this.renderer.getContext();
        // do not count the treble clef width
        this.staveX = 0;
      }

      addMeasure(notes) {
        // add stave
        const measureStave = new VexFlow.Stave(this.staveX, 0, MovingStaff.MEASURE_WIDTH);
        this.staveX += MovingStaff.MEASURE_WIDTH;
        // draw five staff lines and treble clef
        measureStave.setContext(this.context).draw();

        let staveNotes = [];
        notes.forEach((note) => {
          let sn = new VexFlow.StaveNote(note);
          staveNotes.push(sn);
          // NOTE: why does VexFlow not draw a dotted quarter note for me?
          if (note.duration.indexOf("d") != -1) {
            const dot = new VexFlow.Dot();
            sn.addModifier(dot, 0);
          }
        });
        if (staveNotes.length > 0) {
          VexFlow.Formatter.FormatAndDraw(this.context, measureStave, staveNotes);
        }
      }
    };

    const SONG_DATA = {
      title: "Different Colors",
      artist: "Walk the Moon",
      measures: [
        {
          notes: [
            {keys: ["d/4"], duration: "4", fingering: 2},
            {keys: ["f/4"], duration: "4", fingering: 4},
            {keys: ["c/4"], duration: "4", fingering: 1},
            {keys: ["r/4"], duration: "4r", fingering: null}
          ]
        },
        {
          notes: [
            {keys: ["g/4"], duration: "4", fingering: 5},
            {keys: ["a/4"], duration: "8", fingering: 1},
            {keys: ["g/4"], duration: "8", fingering: 5},
            {keys: ["f/4"], duration: "4", fingering: 4},
            {keys: ["r/4"], duration: "4r", fingering: null}
          ]
        },
        {
          notes: [
            {keys: ["d/4"], duration: "4", fingering: 2},
            {keys: ["f/4"], duration: "4", fingering: 4},
            {keys: ["c/4"], duration: "4", fingering: 1},
            {keys: ["r/4"], duration: "4r", fingering: null}
          ]
        },
        {
          notes: [
            {keys: ["g/4"], duration: "4", fingering: 5},
            {keys: ["a/4"], duration: "8", fingering: 1},
            {keys: ["g/4"], duration: "8", fingering: 5},
            {keys: ["f/4"], duration: "4", fingering: 4},
            {keys: ["r/4"], duration: "4r", fingering: null}
          ]
        },
        {
          notes: [
            {keys: ["a/4"], duration: "4", fingering: 1},
            {keys: ["c/5"], duration: "4", fingering: 3},
            {keys: ["a/4"], duration: "4d", fingering: 1},
            {keys: ["f/4"], duration: "8", fingering: 4}
          ]
        },
        {
          notes: [
            {keys: ["a/4"], duration: "4d", fingering: 1},
            {keys: ["g/4"], duration: "8", fingering: 5},
            {keys: ["f/4"], duration: "2", fingering: 4}
          ]
        },
        {
          notes: [
            {keys: ["a/4"], duration: "4", fingering: 1},
            {keys: ["c/5"], duration: "4", fingering: 3},
            {keys: ["a/4"], duration: "4d", fingering: 1},
            {keys: ["f/4"], duration: "8", fingering: 4}
          ]
        },
        {
          notes: [
            {keys: ["a/4"], duration: "4d", fingering: 1},
            {keys: ["g/4"], duration: "8", fingering: 5},
            {keys: ["f/4"], duration: "2", fingering: 4}
          ]
        },
        {
          notes: [
            {keys: ["a/4"], duration: "4", fingering: 1},
            {keys: ["c/5"], duration: "4", fingering: 3},
            {keys: ["a/4"], duration: "4d", fingering: 1},
            {keys: ["f/4"], duration: "8", fingering: 4}
          ]
        },
        {
          notes: [
            {keys: ["a/4"], duration: "4", fingering: 1},
            {keys: ["g/4"], duration: "4", fingering: 5},
            {keys: ["f/4"], duration: "2", fingering: 4}
          ]
        },
        {
          notes: [
            {keys: ["d/4"], duration: "4", fingering: 2},
            {keys: ["f/4"], duration: "4", fingering: 4},
            {keys: ["c/4"], duration: "4", fingering: 1},
            {keys: ["r/4"], duration: "4r", fingering: null}
          ]
        },
        {
          notes: [
            {keys: ["g/4"], duration: "4", fingering: 5},
            {keys: ["a/4"], duration: "8", fingering: 1},
            {keys: ["g/4"], duration: "8", fingering: 5},
            {keys: ["f/4"], duration: "2", fingering: 4}
          ]
        }
      ]
    };

    let movingStaff = new MovingStaff();
    for (let i = 0; i < SONG_DATA.measures.length; i++) {
      movingStaff.addMeasure(SONG_DATA.measures[i].notes);
    }
    // add extra measures at the end so that we do not see empty spaces at the end
    for (let i = 0; i < 10; i++) {
      movingStaff.addMeasure([]);
    }

    let animationId = null;
    let xOffset = 0;

    const moving = () => {
      const animate = (timestamp) => {
        xOffset += 1;
        let ncw = document.getElementById('notes-container');
        ncw.style.transform = `translate3d(-${xOffset}px, 0, 0)`;

        if (xOffset > SONG_DATA.measures.length * MovingStaff.MEASURE_WIDTH) {
          cancelAnimationFrame(animationId);
          animationId = null;
          return;
        }

        animationId = requestAnimationFrame(animate);
      };

      animationId = requestAnimationFrame(animate);
    };

    document.addEventListener('DOMContentLoaded', () => {
      moving();
    });

    document.getElementById('pauseButton').addEventListener('click', () => {
      cancelAnimationFrame(animationId);
      animationId = null;
    });
    document.getElementById('resumeButton').addEventListener('click', () => {
      moving();
    });
    document.getElementById('resetButton').addEventListener('click', () => {
      xOffset = 0;
      cancelAnimationFrame(animationId);
      animationId = null;
      let ncw = document.getElementById('notes-container');
      ncw.style.transform = `translate3d(-${xOffset}px, 0, 0)`;
    });

    // Initialize grid
    drawGrid(gridSize);

    // Add mouse coordinate tracking
    document.addEventListener('mousemove', function(e) {
      const container = document.getElementById('container');
      const rect = container.getBoundingClientRect();
      const x = Math.round(e.clientX - rect.left);
      const y = Math.round(e.clientY - rect.top);
      document.getElementById('info').textContent = `Grid: ${gridSize}px | Mouse: (${x}, ${y})`;
    });

    // Redraw grid on window resize
    window.addEventListener('resize', () => {
      drawGrid(gridSize);
    });

  </script>
</body>

</html>
