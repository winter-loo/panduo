<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>vexflow demo</title>
  <style>
    body { margin: 0; padding: 20px; font-family: Arial, sans-serif; }
    #container { position: relative; }
    #output { position: relative; z-index: 2; }
    #grid {
      position: absolute;
      top: 0;
      left: 0;
      pointer-events: none;
      z-index: 1;
      opacity: 0.3;
    }
    .controls { margin-bottom: 10px; }
    button { margin-right: 10px; padding: 5px 10px; }
  </style>
</head>
<body>
  <div class="controls">
    <button onclick="toggleGrid()">Toggle Grid</button>
    <button onclick="changeGridSize(5)">5px Grid</button>
    <button onclick="changeGridSize(10)">10px Grid</button>
    <button onclick="changeGridSize(20)">20px Grid</button>
    <span id="info">Grid: 10px</span>
  </div>

  <div id="container">
    <svg id="grid" width="800" height="300"></svg>
    <canvas id="output"></canvas>
  </div>

  <script src="../../build/cjs/vexflow-debug.js"></script>
  <script>
    VexFlow.StaveNote.DEBUG = true;

    let gridSize = 10;
    let gridVisible = true;

    function drawGrid(size) {
      const grid = document.getElementById('grid');
      const width = 800;
      const height = 300;

      grid.innerHTML = '';
      grid.setAttribute('width', width);
      grid.setAttribute('height', height);

      // Vertical lines
      for (let x = 0; x <= width; x += size) {
        const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
        line.setAttribute('x1', x);
        line.setAttribute('y1', 0);
        line.setAttribute('x2', x);
        line.setAttribute('y2', height);
        line.setAttribute('stroke', x % (size * 5) === 0 ? '#ff0000' : '#cccccc');
        line.setAttribute('stroke-width', x % (size * 5) === 0 ? '1' : '0.5');
        grid.appendChild(line);
      }

      // Horizontal lines
      for (let y = 0; y <= height; y += size) {
        const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
        line.setAttribute('x1', 0);
        line.setAttribute('y1', y);
        line.setAttribute('x2', width);
        line.setAttribute('y2', y);
        line.setAttribute('stroke', y % (size * 5) === 0 ? '#ff0000' : '#cccccc');
        line.setAttribute('stroke-width', y % (size * 5) === 0 ? '1' : '0.5');
        grid.appendChild(line);
      }

      // Add coordinate labels
      for (let x = 0; x <= width; x += size * 5) {
        const text = document.createElementNS('http://www.w3.org/2000/svg', 'text');
        text.setAttribute('x', x + 2);
        text.setAttribute('y', 12);
        text.setAttribute('font-size', '10');
        text.setAttribute('fill', '#666');
        text.textContent = x;
        grid.appendChild(text);
      }

      for (let y = size * 5; y <= height; y += size * 5) {
        const text = document.createElementNS('http://www.w3.org/2000/svg', 'text');
        text.setAttribute('x', 2);
        text.setAttribute('y', y - 2);
        text.setAttribute('font-size', '10');
        text.setAttribute('fill', '#666');
        text.textContent = y;
        grid.appendChild(text);
      }
    }

    function toggleGrid() {
      gridVisible = !gridVisible;
      document.getElementById('grid').style.display = gridVisible ? 'block' : 'none';
    }

    function changeGridSize(size) {
      gridSize = size;
      drawGrid(size);
      document.getElementById('info').textContent = `Grid: ${size}px`;
    }

    // Initialize grid
    drawGrid(gridSize);

    // Create VexFlow notation
    const factory = new VexFlow.Factory({
      renderer: {
        elementId: 'output',
        backend: VexFlow.Renderer.Backends.CANVAS,
        width: 800,
        height: 300,
      },
    });
    const score = factory.EasyScore();
    const system = factory.System();
    const voice = score.voice().setMode(Voice.Mode.SOFT);
    const notes = score.notes('b4/4,b4/8,b4/8,b4/4,b4/4,b4/2,b4/2,b4/4,b4/8,b4/8,b4/4,b4/4,b4/2,b4/2,b4/4,b4/8,b4/8,b4/4,b4/4,b4/2,b4/2,b4/4,b4/2,b4/8,b4/8');
    voice.addTicktables(notes);

    // Modify headroom (spaceAboveStaffLn) for the stave
    const stave = system.addStave({
      voices: [voice],
      options: { spaceAboveStaffLn: 0 }  // Changed from default 4 to 0
    }).addClef('treble').addTimeSignature('4/4');

    factory.draw();

    // Add mouse coordinate tracking
    document.addEventListener('mousemove', function(e) {
      const container = document.getElementById('container');
      const rect = container.getBoundingClientRect();
      const x = Math.round(e.clientX - rect.left);
      const y = Math.round(e.clientY - rect.top);
      document.getElementById('info').textContent = `Grid: ${gridSize}px | Mouse: (${x}, ${y})`;
    });
  </script>
</body>
</html>
